services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Published on the host's loopback only; set OPENPF_BIND=0.0.0.0 (and
    # OPENPF_API_TOKEN in backend/.env) to expose it.
    ports:
      - "${OPENPF_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ${OPENPF_DB_FILE:-./backend/openpf.db}:/app/openpf.db
      - ./.claude:/app/.claude
      - ./backend/logs:/app/logs
    env_file: ./backend/.env
    environment:
      PROJECT_ROOT: /app
      INPROC_SCHEDULER_ENABLED: "false"
    restart: unless-stopped

  worker:
    build: ./backend
    command: python worker.py
    volumes:
      - ${OPENPF_DB_FILE:-./backend/openpf.db}:/app/openpf.db
      - ./.claude:/app/.claude
      - ./backend/logs:/app/logs
    env_file: ./backend/.env
    environment:
      PROJECT_ROOT: /app
      WORKER_POLL_SECONDS: "15"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    ports:
      - "${OPENPF_BIND:-127.0.0.1}:5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - backend
    restart: unless-stopped
