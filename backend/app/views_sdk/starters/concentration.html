<!-- openpf-view {"title": "Concentration", "description": "How much rides on a few names and sectors — top-N weight, sector mix and effective diversification", "icon": "pie-chart"} -->
<div class="op-stack">
  <div class="op-grid op-grid-4" id="stats">
    <div class="op-card op-skeleton" style="height: 104px"></div>
    <div class="op-card op-skeleton" style="height: 104px"></div>
    <div class="op-card op-skeleton" style="height: 104px"></div>
    <div class="op-card op-skeleton" style="height: 104px"></div>
  </div>

  <div class="op-grid op-grid-2">
    <section class="op-card">
      <div class="op-card-header">
        <div>
          <div class="op-card-title">Largest positions</div>
          <div class="op-card-desc">Share of total portfolio, cash included</div>
        </div>
      </div>
      <div id="top"><div class="op-skeleton" style="height: 260px"></div></div>
    </section>

    <section class="op-card">
      <div class="op-card-header">
        <div>
          <div class="op-card-title">Sector mix</div>
          <div class="op-card-desc">Largest holdings classified by sector; funds and unknowns grouped</div>
        </div>
      </div>
      <div id="sectors"><div class="op-skeleton" style="height: 260px"></div></div>
    </section>
  </div>

  <section class="op-card">
    <div class="op-card-header">
      <div>
        <div class="op-card-title">Cumulative weight</div>
        <div class="op-card-desc">How quickly the portfolio adds up when holdings are ranked by size</div>
      </div>
    </div>
    <div id="curve"><div class="op-skeleton" style="height: 200px"></div></div>
  </section>

  <section class="op-card">
    <div class="op-between">
      <div style="max-width: 640px">
        <div class="op-card-title">Reading this</div>
        <p class="op-card-desc" style="margin-top: 6px" id="explain"></p>
      </div>
      <button class="op-btn op-btn-sm" id="ask">Ask Archie about my concentration</button>
    </div>
  </section>
</div>

<script>
openpf.ready(async () => {
  const pf = await openpf.data('portfolio')
  const pos = pf.positions.filter((p) => (p.value || 0) > 0)
  const total = pf.account.total || pos.reduce((a, p) => a + p.value, 0)
  const w = pos.map((p) => p.value / total)

  const topN = (n) => w.slice(0, n).reduce((a, x) => a + x, 0)
  const invested = pos.reduce((a, p) => a + p.value, 0)
  const hhi = pos.reduce((a, p) => a + Math.pow(p.value / invested, 2), 0) // among invested holdings
  const effective = hhi ? 1 / hhi : 0

  const stat = (label, value, hint, cls = '') => `
    <div class="op-card op-stat">
      <div class="op-stat-label">${label}</div>
      <div class="op-stat-value ${cls}">${openpf.esc(value)}</div>
      <div class="op-stat-hint">${hint}</div>
    </div>`
  const top1 = topN(1)
  const top5 = topN(5)
  document.getElementById('stats').innerHTML =
    stat('Largest holding', openpf.pct(top1, { decimals: 1 }), openpf.esc(pos[0] ? pos[0].ticker : '—'), top1 > 0.2 ? 'op-warning' : '') +
    stat('Top 5', openpf.pct(top5, { decimals: 1 }), `Top 10 · ${openpf.pct(topN(10), { decimals: 1 })}`, top5 > 0.6 ? 'op-warning' : '') +
    stat('Effective holdings', openpf.num(effective, { decimals: 1 }), `${pos.length} actual · HHI ${openpf.num(hhi, { decimals: 3 })}`) +
    stat('Cash', openpf.pct(pf.metrics.cash_ratio, { decimals: 1 }), openpf.esc(openpf.money(pf.account.free_cash)))

  openpf.charts.bar('#top', {
    horizontal: true,
    data: pos.slice(0, 10).map((p, i) => ({ label: p.ticker, value: w[i], color: w[i] > 0.15 ? 'var(--warning)' : 'var(--chart-1)' })),
    format: (v) => openpf.pct(v, { decimals: 1 }),
    onClick: (d) => openpf.openTicker(d.label),
  })

  // Cumulative curve (rank → cumulative weight)
  let acc = 0
  openpf.charts.area('#curve', {
    data: w.map((x, i) => ({ x: i + 1, y: (acc += x) })),
    format: (v) => openpf.pct(v, { decimals: 1 }),
    height: 200,
    zero: true,
  })

  // Sector buckets — fundamentals for the largest 20 holdings, in parallel.
  const sample = pos.slice(0, 20)
  const funds = await Promise.all(sample.map((p) => openpf.data('fundamentals', { ticker: p.yf }).catch(() => null)))
  const buckets = {}
  sample.forEach((p, i) => {
    const sector = (funds[i] && funds[i].sector) || 'Funds & other'
    buckets[sector] = (buckets[sector] || 0) + p.value
  })
  const rest = pos.slice(20).reduce((a, p) => a + p.value, 0)
  if (rest > 0) buckets['Funds & other'] = (buckets['Funds & other'] || 0) + rest
  const sectors = Object.entries(buckets)
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value)
  const topSector = sectors[0]
  openpf.charts.donut('#sectors', {
    data: sectors,
    format: 'money',
    size: 168,
    centerValue: topSector ? openpf.pct(topSector.value / invested, { decimals: 0 }) : '',
    centerLabel: topSector ? topSector.label.split(' ')[0] : '',
  })

  document.getElementById('explain').textContent =
    `Your ${pos.length} holdings behave like ${openpf.num(effective, { decimals: 1 })} equally-sized ones (effective holdings = 1 / HHI, where HHI sums each holding's squared share of the invested total). ` +
    (top5 > 0.6
      ? `The top five make up ${openpf.pct(top5, { decimals: 0 })} of everything, so a bad month for any one of them moves the whole portfolio.`
      : `No single name dominates — the top five are ${openpf.pct(top5, { decimals: 0 })} of the total.`) +
    (topSector ? ` ${topSector.label} is the biggest sector at ${openpf.pct(topSector.value / invested, { decimals: 0 })} of invested money.` : '')

  document.getElementById('ask').addEventListener('click', () => {
    openpf.ask(
      `My top 5 holdings are ${openpf.pct(top5, { decimals: 0 })} of my portfolio (largest ${pos[0] ? pos[0].ticker : ''} at ${openpf.pct(top1, { decimals: 1 })}), effective holdings ${openpf.num(effective, { decimals: 1 })}, and ${topSector ? topSector.label : 'one sector'} is ${topSector ? openpf.pct(topSector.value / invested, { decimals: 0 }) : ''} of invested money. Is this concentration a problem for me, and what would you change?`,
    )
  })
})
</script>
