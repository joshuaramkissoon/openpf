<!-- openpf-view {"title": "Dividend income", "description": "What your holdings have paid you, month by month — and what they're on course to pay", "icon": "coins"} -->
<div class="op-stack">
  <div class="op-grid op-grid-3" id="stats">
    <div class="op-card op-skeleton" style="height: 104px"></div>
    <div class="op-card op-skeleton" style="height: 104px"></div>
    <div class="op-card op-skeleton" style="height: 104px"></div>
  </div>

  <section class="op-card">
    <div class="op-card-header">
      <div>
        <div class="op-card-title">Received by month</div>
        <div class="op-card-desc">Last 12 months, all accounts</div>
      </div>
      <span class="op-badge" id="months-paid"></span>
    </div>
    <div id="monthly"><div class="op-skeleton" style="height: 240px"></div></div>
  </section>

  <div class="op-grid op-grid-2">
    <section class="op-card">
      <div class="op-card-header">
        <div>
          <div class="op-card-title">On course to pay</div>
          <div class="op-card-desc">Current dividend yield × position value, next 12 months</div>
        </div>
      </div>
      <div id="forward"><div class="op-skeleton" style="height: 200px"></div></div>
    </section>

    <section class="op-card op-card-flush">
      <div class="op-card-header">
        <div>
          <div class="op-card-title">Recent payments</div>
          <div class="op-card-desc">Newest first</div>
        </div>
      </div>
      <div id="recent"><div class="op-skeleton" style="height: 200px; margin: 0 20px 20px"></div></div>
    </section>
  </div>
</div>

<script>
openpf.ready(async () => {
  const [div, pf] = await Promise.all([openpf.data('dividends'), openpf.data('portfolio')])

  // ── last 12 calendar months, zero-filled ──
  const byMonth = Object.fromEntries(div.monthly.map((m) => [m.month, m.amount]))
  const now = new Date()
  const months = []
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1)
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
    months.push({ key, label: openpf.date(key, 'month'), short: openpf.date(key, 'monthShort'), value: byMonth[key] || 0 })
  }
  const last12 = months.reduce((a, m) => a + m.value, 0)
  const paidMonths = months.filter((m) => m.value > 0).length

  // ── forward income: yield × value for the largest holdings ──
  const top = pf.positions.slice(0, 16)
  const funds = await Promise.all(
    top.map((p) => openpf.data('fundamentals', { ticker: p.yf }).catch(() => null)),
  )
  const payers = top
    .map((p, i) => ({ ticker: p.ticker, name: p.name, value: p.value, yield: funds[i] && funds[i].dividend_yield }))
    .filter((p) => p.yield && p.yield > 0)
    .map((p) => ({ ...p, income: p.value * p.yield }))
    .sort((a, b) => b.income - a.income)
  const forward = payers.reduce((a, p) => a + p.income, 0)
  const portfolioYield = pf.account.total ? forward / pf.account.total : null

  // ── stats ──
  const stat = (label, value, hint, cls = '') => `
    <div class="op-card op-stat">
      <div class="op-stat-label">${openpf.esc(label)}</div>
      <div class="op-stat-value ${cls}">${openpf.esc(value)}</div>
      <div class="op-stat-hint">${hint}</div>
    </div>`
  document.getElementById('stats').innerHTML =
    stat('Last 12 months', openpf.money(last12), `${openpf.esc(openpf.money(last12 / 12))} a month on average`) +
    stat('Forward 12 months', openpf.money(forward), `From ${payers.length} paying holding${payers.length === 1 ? '' : 's'}`) +
    stat('Portfolio yield', portfolioYield == null ? '—' : openpf.pct(portfolioYield, { decimals: 2 }), `All-time received ${openpf.esc(openpf.money(div.total))}`)

  document.getElementById('months-paid').textContent = `${paidMonths} of 12 months paid`

  openpf.charts.bar('#monthly', {
    data: months.map((m) => ({ label: m.label, short: m.short, value: m.value, muted: m.value === 0 })),
    format: 'money',
    height: 240,
  })

  if (payers.length) {
    openpf.charts.bar('#forward', {
      horizontal: true,
      data: payers.slice(0, 8).map((p) => ({ label: p.ticker, value: p.income, ticker: p.ticker })),
      format: (v, d) => `${openpf.money(v)}`,
      onClick: (d) => openpf.openTicker(d.ticker),
    })
  } else {
    document.getElementById('forward').innerHTML = '<div class="op-empty">None of your largest holdings currently pay a dividend.</div>'
  }

  openpf.table('#recent', {
    columns: [
      { key: 'paid_on', label: 'Paid', render: (v) => openpf.esc(openpf.date(v)) },
      { key: 'ticker', label: 'Holding', ticker: true },
      { key: 'account', label: 'Account', render: (v) => `<span class="op-badge">${v === 'stocks_isa' ? 'ISA' : 'Invest'}</span>` },
      { key: 'amount', label: 'Amount', format: 'money' },
    ],
    rows: div.items.slice(0, 8),
    sortable: false,
    empty: 'No dividends yet — payments appear here as soon as your broker records them.',
  })
})
</script>
